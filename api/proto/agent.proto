syntax = "proto3";

package agentgw;

option go_package = "github.com/wereliang/aiagw/api/proto";

service AgentGateway {
  rpc Connect(stream AgentMessage) returns (stream GatewayMessage);
}

message AgentRegister {
  string agent_id = 1;
  string agent_type = 2;
  map<string, string> metadata = 3;
}

message AgentMessage {
  oneof payload {
    AgentRegister register = 1;
    AgentResponse response = 2;
    Heartbeat heartbeat = 3;
  }
}

message GatewayMessage {
  oneof payload {
    AgentRequest request = 1;
    Heartbeat heartbeat = 2;
  }
}

message AgentRequest {
  string request_id = 1;
  string session_id = 2;
  string model = 3;
  repeated ChatMessage messages = 4;
  map<string, string> parameters = 5;
}

message AgentResponse {
  string request_id = 1;
  string session_id = 2;
  oneof content {
    ChatMessage message = 3;
    StreamChunk chunk = 4;
  }
  bool done = 5;
}

message ChatMessage {
  string role = 1;
  string content = 2;
}

message StreamChunk {
  string content = 1;
  string reasoning_content = 2;
}

message Heartbeat {
  int64 timestamp = 1;
}
