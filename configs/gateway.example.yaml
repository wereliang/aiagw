server:
  http_port: 8080
  grpc_port: 19090
  internal_grpc_port: 19091
  instance_id: ""
  # advertise_addr: full address for peer-to-peer communication in K8s
  # e.g. "gateway-0.gateway-headless.aiagw.svc.cluster.local:19091"
  # Can be overridden by ADVERTISE_ADDR env var
  advertise_addr: ""

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

session:
  ttl: 30m

agent:
  heartbeat_interval: 30s
  heartbeat_timeout: 90s

auth:
  # Add your API keys here
  api_keys: []

log:
  level: info
  # format: json
