apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: aiagw
data:
  gateway.yaml: |
    server:
      http_port: 8080
      grpc_port: 19090
      internal_grpc_port: 19091
      instance_id: ""
      advertise_addr: ""
    redis:
      addr: "redis.aiagw.svc.cluster.local:6379"
      password: ""
      db: 0
    session:
      ttl: 30m
    agent:
      heartbeat_interval: 30s
      heartbeat_timeout: 90s
    auth:
      api_keys: []
    log:
      level: info
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-headless
  namespace: aiagw
spec:
  clusterIP: None
  selector:
    app: gateway
  ports:
    - name: internal-grpc
      port: 19091
      targetPort: 19091
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: aiagw
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 19090
      targetPort: 19090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gateway
  namespace: aiagw
spec:
  serviceName: gateway-headless
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: aiagw/gateway:latest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/aiagw/gateway.yaml"]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 19090
              name: grpc
            - containerPort: 19091
              name: internal-grpc
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: INSTANCE_ID
              value: "$(POD_NAME)"
            - name: ADVERTISE_ADDR
              value: "$(POD_NAME).gateway-headless.aiagw.svc.cluster.local:19091"
          volumeMounts:
            - name: config
              mountPath: /etc/aiagw
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: gateway-config
